<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bond - live</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:wght@500;600&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem('bond-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
:root{--bg:#f6f5f1;--paper:#fff;--ink:#0f1f2e;--mut:#5a6878;--line:#e2dfd6;--line2:#d3cfc3;--green:#0e5f4e;--greenbg:#e5f1ed;--greenline:#c3ddd5;--blue:#24507f;--gold:#8a6410}
[data-theme=dark]{--bg:#0b1520;--paper:#122030;--ink:#e8eef5;--mut:#9aabbd;--line:#21344a;--line2:#31475f;--green:#5fc4a5;--greenbg:#12352a;--greenline:#1f4a3c;--blue:#83b4e6;--gold:#e0b862}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "IBM Plex Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:900px;margin:0 auto;padding:36px 24px}
h1{margin:0 0 6px;font:600 34px "Source Serif 4",serif;letter-spacing:-.01em}.muted{color:var(--mut)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:22px 0}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px}.card b{display:block;font:600 32px "Source Serif 4",serif}.card span{font-size:13px}
.money{background:var(--greenbg);border-color:var(--greenline)}.money b{color:var(--green)}
#feed{list-style:none;padding:0;margin:0;background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden}
#feed li{padding:11px 16px;border-bottom:1px solid var(--line);display:flex;gap:14px;font-size:14.5px}#feed li:last-child{border:0}
#feed .t{color:var(--mut);min-width:78px}#feed .k{min-width:170px;font-weight:600;text-transform:capitalize}
.bond_captured{color:var(--green)}.bond_released{color:var(--blue)}.bond_held{color:var(--gold)}.waiting_room{color:var(--mut)}
#themeBtn{position:fixed;top:14px;right:14px;width:38px;height:38px;border-radius:8px;display:grid;place-items:center;background:var(--paper);color:var(--ink);border:1px solid var(--line2);cursor:pointer}
#themeBtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#themeBtn .moon{display:none}[data-theme=dark] #themeBtn .sun{display:none}[data-theme=dark] #themeBtn .moon{display:block}
</style>
<button id="themeBtn" aria-label="Toggle dark mode" title="Toggle dark mode"><svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg></button>
<script>document.getElementById('themeBtn').onclick=function(){var d=document.documentElement,n=d.dataset.theme==='dark'?'light':'dark';d.dataset.theme=n;try{localStorage.setItem('bond-theme',n)}catch(e){}}</script>
<main>
<h1>Bond <span class="muted">live</span></h1>
<p class="muted">Strangers and AI agents post a refundable card hold to reach the inbox. Junk keeps the bond. Worth it releases it.</p>
<div class="stats">
<div class="card"><span class="muted">Held now</span><b id="held">0</b></div>
<div class="card"><span class="muted">Released</span><b id="released">0</b></div>
<div class="card"><span class="muted">Junk captured</span><b id="captured">0</b></div>
<div class="card money"><span class="muted">Recipient earned</span><b id="cents">$0.00</b></div>
<div class="card"><span class="muted">Waiting room</span><b id="waiting">0</b></div>
</div>
<ul id="feed"></ul>
</main>
<script>
let since=0;const feed=document.getElementById("feed"),$=id=>document.getElementById(id);
const usd=c=>"$"+((c||0)/100).toFixed(2);
async function tick(){
  try{
    const j=await (await fetch("/api/events?since="+since)).json(), s=j.stats;
    $("held").textContent=s.held;$("released").textContent=s.released;$("captured").textContent=s.captured;
    $("cents").textContent=usd(s.captured_cents);$("waiting").textContent=s.waiting;
    for(const e of j.events){
      since=Math.max(since,e.id);
      if(e.type.startsWith("mail_")||e.type.startsWith("payment_intent"))continue;
      let d={};try{d=JSON.parse(e.data||"{}")}catch{}
      const li=document.createElement("li");
      li.innerHTML='<span class="t"></span><span class="k '+e.type+'"></span><span class="d"></span>';
      li.children[0].textContent=new Date(e.ts).toLocaleTimeString();
      li.children[1].textContent=e.type.replace(/_/g," ");
      li.children[2].textContent=[d.from,d.category,e.cents?usd(e.cents):""].filter(Boolean).join(" - ");
      feed.prepend(li);
    }
  }catch{}
}
tick();setInterval(tick,1500);
</script>
