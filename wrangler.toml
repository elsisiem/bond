name = "bond"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/b/*", "/d/*", "/r/*", "/webhooks/*", "/setup*", "/live*", "/agents.md", "/terms"]

[[d1_databases]]
binding = "DB"
database_name = "interruption-bond"
database_id = "e63a1ac6-d6f3-4196-9763-47d3def466b2"

[triggers]
crons = ["*/5 * * * *"]

[vars]
ROOT_DOMAIN = "example.com"
PUBLIC_BASE_URL = "http://localhost:8787"
OWNER_EMAIL = "owner@example.com"
DEMO_ALIAS = "demo"
DEFAULT_BOND_CENTS = "100"
MAX_BOND_CENTS = "2500"
BOND_HOLD_HOURS = "72"
WAITING_ROOM_DAYS = "7"
